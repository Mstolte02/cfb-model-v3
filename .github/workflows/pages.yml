# Hosting builds run directly on Vercel. This workflow only refreshes model data.
# Retain pages.yml so existing scheduled capture handoffs continue to work.
name: Refresh playoff projections

on:
  push:
    branches: [main]
    paths:
      - scripts/simulate_playoff.R
      - scripts/conference_titles.R
      - tests/test_conference_titles.R
      - scripts/committee_anchor.R
      - scripts/playoff_record_odds.R
      - tests/test_committee_anchor.R
      - tests/test_playoff_record_odds.R
      - viz/data/model_v4.json
      - viz/data/ratings.json
      - viz/data/schedule.json
      - viz/data/cfp_rankings.json
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playoff-data-refresh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install cached season simulator
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::cfbseedR
            any::jsonlite
          cache-version: 1
      # Both projections use the same engine: the preseason one from the week-0
      # ensemble and Power Ratings, the current one from today's.
      - name: Check conditional playoff probabilities
        run: |
          Rscript tests/test_playoff_record_odds.R
          Rscript tests/test_committee_anchor.R
          Rscript tests/test_conference_titles.R
      - name: Build CFP projections
        run: |
          Rscript scripts/simulate_playoff.R 500 preseason
          Rscript scripts/simulate_playoff.R 2000 current
      - name: Commit refreshed projections for Vercel
        if: github.ref_name == 'main'
        shell: bash
        env:
          CFB_REPO_OWNER: ${{ github.repository_owner }}
          CFB_REPO_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "cfb-playoff-model[bot]"
          git config user.email "cfb-playoff-model[bot]@users.noreply.github.com"
          git add viz/data/playoff_current.json viz/data/playoff_preseason.json
          if git diff --cached --quiet; then
            echo "Projection data is already current."
            exit 0
          fi
          git commit --author="$CFB_REPO_OWNER <$CFB_REPO_OWNER_ID+$CFB_REPO_OWNER@users.noreply.github.com>" -m "Refresh 2026 playoff projections"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Projection push failed after $attempt attempts." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
