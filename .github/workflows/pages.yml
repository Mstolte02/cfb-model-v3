# Publish the site to GitHub Pages on every push to main.
#
# scripts/publish.py is stdlib-only, so this needs no pip install and no model
# dependencies. It copies viz/ to dist/ and drops the working-document diagnostics
# report, which is why the site is not served straight out of viz/ - see that script.
# It is run WITHOUT --no-players, so the roster rows ship and the roster editor works.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install cached season simulator
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::cfbseedR
            any::jsonlite
          cache-version: 1
      # Generate the locked cfbseedR preseason projection once, then restore that
      # exact file on future deploys. A cache miss safely rebuilds both versions.
      - id: preseason-cache
        uses: actions/cache@v4
        with:
          path: viz/data/playoff_preseason.json
          key: cfbseedr-preseason-2026-v1
      - name: Build CFP projections
        env:
          PRESEASON_CACHE_HIT: ${{ steps.preseason-cache.outputs.cache-hit }}
        run: |
          mode=current
          if [ "$PRESEASON_CACHE_HIT" != "true" ]; then mode=both; fi
          Rscript scripts/simulate_playoff.R 500 "$mode"
      - name: Build dist/
        run: python3 scripts/publish.py
      - uses: actions/configure-pages@v6
      # upload-pages-artifact stopped bundling dotfiles in v4, and publish.py
      # writes dist/.nojekyll - so ask for them back explicitly.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
