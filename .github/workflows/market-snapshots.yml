name: Capture market snapshot

on:
  workflow_dispatch:
    inputs:
      lock_weekly_board:
        description: Replace the public board with this capture
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - scripts/capture_market_snapshot.py
      - tests/test_market_tracking.py
      - .github/workflows/market-snapshots.yml
  schedule:
    # Six-hour retrievals during the football calendar. These timestamps are our
    # observation times, not sportsbook-native quote times.
    - cron: "17 */6 * 7-12 *"
    - cron: "17 */6 1-15 1 *"
    # The actionable board locks once a week. July-October is EDT (UTC-4) for
    # the 2026 season; November-January is EST (UTC-5).
    - cron: "30 16 * 7-10 1"
    - cron: "30 17 * 1,11-12 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always capture from the current branch tip. Workflow re-runs otherwise
          # check out the stale SHA from the original failed attempt.
          ref: main
          fetch-depth: 0
      - name: Run market tracking tests
        run: python3 -m unittest tests.test_market_tracking
      - name: Capture timestamped provider prices
        shell: bash
        env:
          LOCK_WEEKLY_BOARD: ${{ inputs.lock_weekly_board || github.event.schedule == '30 16 * 7-10 1' || github.event.schedule == '30 17 * 1,11-12 1' }}
        run: |
          args=(--allow-missing-key)
          if [ "$LOCK_WEEKLY_BOARD" = "true" ]; then
            args+=(--lock-weekly-board)
          fi
          python3 scripts/capture_market_snapshot.py "${args[@]}"
      - id: changes
        name: Record append-only snapshot changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cfb-market-tracker[bot]"
          git config user.email "cfb-market-tracker[bot]@users.noreply.github.com"
          git add data/market_snapshots viz/data/odds.json viz/data/market_tracking.json viz/data/schedule.json viz/data/model_v4.json viz/data/ratings.json
          git commit -m "Capture 2026 market snapshot"
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Snapshot push failed after $attempt attempts." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
      - name: Build publishable site
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/publish.py
      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          path: dist
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5
        if: steps.changes.outputs.changed == 'true'
